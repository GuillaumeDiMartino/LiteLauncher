plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.lite.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.lite.launcher'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key: fine for sideloading on your own device.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
